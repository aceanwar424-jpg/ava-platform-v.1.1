<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Klien Korporat — OneLab</title>
<!-- Halaman ini dibuka pihak LUAR (PIC perusahaan klien), bukan staf klinik.
     Karena itu berdiri sendiri: tidak memuat modul operasional apa pun, dan
     satu-satunya jalan ke data adalah endpoint portal bertoken. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F8FAFC;--surface:#FFFFFF;--line:#E2E8F0;--text:#0F172A;--text2:#334155;
        --text3:#64748B;--teal:#0891B2;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--navy:#0B1F3A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .bar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .bar h1{margin:0;font-size:15px;font-weight:800}
  .bar .sub{font-size:11.5px;color:#9DB4D0;margin-left:auto}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .card h2{margin:0;padding:13px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
  .pad{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--text3);font-weight:600;padding:9px 16px}
  td{padding:9px 16px;border-top:1px solid var(--line)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
  .kpi .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F1F5F9;color:var(--text2)}
  .pesan{max-width:460px;margin:80px auto;text-align:center;background:var(--surface);
         border:1px solid var(--line);border-radius:14px;padding:30px 26px}
  .pesan h2{border:0;padding:0;font-size:15px;margin:0 0 8px}
  .pesan p{font-size:13px;color:var(--text3);line-height:1.6;margin:0}
  .mini{font-size:11.5px;color:var(--text3)}
  @media(max-width:640px){ th:nth-child(n+4),td:nth-child(n+4){display:none} }
</style>
</head>
<body>
<div class="bar">
  <h1>OneLab · Portal Klien</h1>
  <span class="sub" id="bar-sub"></span>
</div>
<div class="wrap" id="isi">
  <div class="pesan"><h2>Memuat…</h2><p>Mengambil data perusahaan Anda.</p></div>
</div>

<script>
// Endpoint dipilih sesuai tempat halaman ini dibuka: instalasi lokal klinik
// atau Supabase cloud. Tidak ada kunci apa pun di halaman ini — token dari
// tautan adalah satu-satunya kredensial, dan cakupannya ditentukan server.
const LOKAL = ['127.0.0.1', 'localhost'].includes(location.hostname);
const BASIS = LOKAL ? `${location.protocol}//${location.hostname}:54329` : 'https://rmyqzyfvlmjxtatpctks.supabase.co';

const rp = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '—';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pesan(judul, teks) {
  document.getElementById('isi').innerHTML =
    `<div class="pesan"><h2>${esc(judul)}</h2><p>${esc(teks)}</p></div>`;
}

(async () => {
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!token) { pesan('Tautan tidak lengkap', 'Buka portal melalui tautan yang dikirimkan OneLab kepada Anda.'); return; }

  let d;
  try {
    const res = await fetch(`${BASIS}/functions/v1/portal`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    d = await res.json();
  } catch (e) {
    pesan('Tidak dapat terhubung', 'Periksa sambungan internet Anda, lalu muat ulang halaman ini.');
    return;
  }

  if (!d || d.error) { pesan('Tautan tidak berlaku', (d && d.error) || 'Silakan hubungi OneLab.'); return; }

  const p = d.perusahaan || {};
  document.getElementById('bar-sub').textContent = p.nama || '';

  const kontrak = d.kontrak || [], periksa = d.pemeriksaan || [], tagihan = d.tagihan || [];
  const kar = d.karyawan_ringkas || {};
  const kontrakAktif = kontrak.filter(k => (k.status || '') === 'Active');
  const kuota = kontrakAktif.reduce((s, k) => s + Number(k.kuota || 0), 0);
  const pakai = kontrakAktif.reduce((s, k) => s + Number(k.terpakai || 0), 0);
  const belumLunas = tagihan.filter(t => !['Dibayar','Dibatalkan'].includes(t.status || ''));

  document.getElementById('isi').innerHTML = `
    <div class="kpi">
      <div><div class="l">Karyawan terdaftar</div><div class="v">${kar.total || 0}</div></div>
      <div><div class="l">Kuota MCU terpakai</div><div class="v">${pakai}${kuota ? ' / ' + kuota : ''}</div></div>
      <div><div class="l">Pemeriksaan tercatat</div><div class="v">${periksa.length}</div></div>
      <div><div class="l">Tagihan belum lunas</div>
        <div class="v" style="color:${belumLunas.length ? 'var(--bad)' : 'var(--ok)'}">
          ${rp(belumLunas.reduce((s, t) => s + Number(t.nilai || 0), 0))}</div></div>
    </div>

    <div class="card"><h2>Kontrak</h2>
      ${kontrak.length ? `<table><thead><tr><th>Nomor</th><th>Jenis</th><th>Periode</th>
        <th>Kuota</th><th>Status</th></tr></thead><tbody>
        ${kontrak.map(k => `<tr><td>${esc(k.nomor)}</td><td>${esc(k.jenis)}</td>
          <td>${tgl(k.mulai)} – ${tgl(k.selesai)}</td>
          <td>${k.terpakai || 0} / ${k.kuota || 0}</td>
          <td><span class="badge">${esc(k.status)}</span></td></tr>`).join('')}
        </tbody></table>` : `<div class="pad mini">Belum ada kontrak tercatat.</div>`}
    </div>

    <div class="card"><h2>Pemeriksaan Karyawan</h2>
      ${periksa.length ? `<div style="max-height:420px;overflow:auto"><table>
        <thead><tr><th>Tanggal</th><th>Nama</th><th>Departemen</th><th>Paket</th><th>Status</th></tr></thead>
        <tbody>${periksa.map(x => `<tr><td>${tgl(x.tanggal)}</td><td>${esc(x.nama)}</td>
          <td>${esc(x.departemen)}</td><td>${esc(x.paket)}</td>
          <td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')}
        </tbody></table></div>`
        : `<div class="pad mini">Belum ada pemeriksaan tercatat.</div>`}
      <div class="pad mini" style="border-top:1px solid var(--line)">
        Portal ini menampilkan <b>status</b> pemeriksaan, bukan hasil medis.
        Hasil pemeriksaan bersifat rahasia dan hanya diberikan kepada karyawan
        yang bersangkutan sesuai UU Perlindungan Data Pribadi.
      </div>
    </div>

    <div class="card"><h2>Tagihan</h2>
      ${tagihan.length ? `<table><thead><tr><th>Nomor</th><th>Tanggal</th>
        <th>Jatuh tempo</th><th>Nilai</th><th>Status</th></tr></thead><tbody>
        ${tagihan.map(t => {
          const lewat = t.jatuh_tempo && new Date(t.jatuh_tempo) < new Date()
                        && !['Dibayar','Dibatalkan'].includes(t.status || '');
          return `<tr><td>${esc(t.nomor)}</td><td>${tgl(t.tanggal)}</td>
            <td style="color:${lewat ? 'var(--bad)' : 'inherit'}">${tgl(t.jatuh_tempo)}</td>
            <td>${rp(t.nilai)}</td>
            <td><span class="badge">${esc(t.status)}</span></td></tr>`; }).join('')}
        </tbody></table>` : `<div class="pad mini">Belum ada tagihan.</div>`}
    </div>

    <div class="mini" style="text-align:center;padding:8px 0 24px">
      Akses portal ini${d.berlaku_sampai ? ' berlaku sampai ' + tgl(d.berlaku_sampai) : ''}.
      Jangan bagikan tautan ini — siapa pun yang memilikinya dapat melihat halaman ini.
    </div>`;
})();
</script>
</body>
</html>
