<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Dokter Perujuk — AVA</title>
<!-- Dibuka pihak LUAR (dokter atau klinik perujuk), bukan staf. Berdiri
     sendiri: tidak memuat modul operasional apa pun, dan satu-satunya jalan
     ke data adalah endpoint portal bertoken. Struktur dan gaya sengaja sama
     persis dengan portal_korporat.html — dua portal yang tampak berbeda
     membuat orang mengira aturannya juga berbeda. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F8FAFC;--surface:#FFFFFF;--line:#E2E8F0;--text:#0F172A;--text2:#334155;
        --text3:#64748B;--teal:#0891B2;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--navy:#0B1F3A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .bar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .bar h1{margin:0;font-size:15px;font-weight:800}
  .bar .sub{font-size:11.5px;color:#9DB4D0;margin-left:auto}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .card h2{margin:0;padding:13px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
  .pad{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--text3);font-weight:600;padding:9px 16px}
  td{padding:9px 16px;border-top:1px solid var(--line)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
  .kpi .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F1F5F9;color:var(--text2)}
  .pesan{max-width:460px;margin:80px auto;text-align:center;background:var(--surface);
         border:1px solid var(--line);border-radius:14px;padding:30px 26px}
  .pesan h2{border:0;padding:0;font-size:15px;margin:0 0 8px}
  .pesan p{font-size:13px;color:var(--text3);line-height:1.6;margin:0}
  .mini{font-size:11.5px;color:var(--text3)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  @media(max-width:640px){ th:nth-child(n+4),td:nth-child(n+4){display:none} }
</style>
</head>
<body>
<div class="bar">
  <h1>AVA · Portal Perujuk</h1>
  <span class="sub" id="bar-sub"></span>
</div>
<div class="wrap" id="isi">
  <div class="pesan"><h2>Memuat…</h2><p>Mengambil data rujukan Anda.</p></div>
</div>

<script>
const LOKAL = ['127.0.0.1', 'localhost'].includes(location.hostname);
const BASIS = LOKAL ? `${location.protocol}//${location.hostname}:54329` : 'https://rmyqzyfvlmjxtatpctks.supabase.co';

const rp  = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '—';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pesan(judul, teks) {
  document.getElementById('isi').innerHTML =
    `<div class="pesan"><h2>${esc(judul)}</h2><p>${esc(teks)}</p></div>`;
}

(async () => {
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!token) { pesan('Tautan tidak lengkap', 'Buka portal melalui tautan yang dikirimkan AVA kepada Anda.'); return; }

  let d;
  try {
    const res = await fetch(`${BASIS}/functions/v1/portal`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    d = await res.json();
  } catch (e) {
    pesan('Tidak dapat terhubung', 'Periksa sambungan internet Anda, lalu muat ulang halaman ini.');
    return;
  }

  if (!d || d.error) { pesan('Tautan tidak berlaku', (d && d.error) || 'Silakan hubungi AVA.'); return; }

  const p    = d.perujuk || {};
  const r    = d.ringkas || {};
  const list = d.rujukan || [];
  const cair = d.pencairan || [];
  const dicairkan = Number(d.sudah_dicairkan || 0);
  const saldo = Number(r.komisi_terkumpul || 0) - dicairkan;

  document.getElementById('bar-sub').textContent = p.nama || '';

  // Tarif ditampilkan terang-terangan. Komisi yang tidak bisa dicek sendiri
  // oleh penerimanya adalah sumber sengketa yang paling sering.
  const tarif = [
    Number(p.komisi_persen) ? Number(p.komisi_persen) + '% dari nilai layanan' : '',
    Number(p.komisi_tetap)  ? rp(p.komisi_tetap) + ' per pasien' : '',
  ].filter(Boolean).join(' + ') || 'belum ditetapkan';

  document.getElementById('isi').innerHTML = `
    <div class="kpi">
      <div><div class="l">Pasien dirujuk</div><div class="v">${Number(r.jumlah_rujukan || 0)}</div>
        ${Number(r.jumlah_batal) ? `<div class="mini">${Number(r.jumlah_batal)} dibatalkan</div>` : ''}</div>
      <div><div class="l">Nilai layanan</div><div class="v">${rp(r.nilai_rujukan)}</div></div>
      <div><div class="l">Komisi terkumpul</div><div class="v">${rp(r.komisi_terkumpul)}</div></div>
      <div><div class="l">${saldo < 0 ? 'Kelebihan bayar' : 'Saldo belum dicairkan'}</div>
        <div class="v" style="color:${saldo > 0 ? 'var(--ok)' : saldo < 0 ? 'var(--warn)' : 'var(--text3)'}">
          ${rp(Math.abs(saldo))}</div>
        ${dicairkan ? `<div class="mini">${rp(dicairkan)} sudah dibayarkan</div>` : ''}
        ${saldo < 0 ? `<div class="mini">Sebagian pendaftaran dibatalkan setelah komisinya
          dibayarkan. Selisih ini diperhitungkan pada pencairan berikutnya.</div>` : ''}</div>
    </div>

    <div class="card">
      <h2>Tarif untuk Rujukan Baru</h2>
      <div class="pad mini" style="line-height:1.7">
        <b style="color:var(--text)">${esc(tarif)}</b><br>
        Berlaku untuk pasien yang didaftarkan mulai sekarang, dihitung dari nilai bersih
        layanan. Pendaftaran yang dibatalkan tidak menghasilkan komisi.
        <br><br>
        <b style="color:var(--text)">Rujukan yang sudah tercatat tidak memakai tarif ini.</b>
        Setiap baris di bawah memakai tarif yang berlaku saat pasiennya didaftarkan, dan
        nilainya tidak ikut berubah bila tarif diperbarui — sehingga komisi yang sudah
        disepakati tidak bisa bergeser di belakang.
      </div>
    </div>

    <div class="card">
      <h2>Pasien yang Anda Rujuk</h2>
      ${list.length ? `<div style="overflow-x:auto"><table>
        <thead><tr><th>Tanggal</th><th>Pasien</th><th>Status</th>
          <th class="num">Nilai layanan</th><th class="num">Komisi</th></tr></thead>
        <tbody>${list.map(x => `<tr>
          <td>${tgl(x.tanggal)}</td>
          <td>${esc(x.pasien)}</td>
          <td><span class="badge"${x.batal ? ' style="color:var(--bad)"' : ''}>${esc(x.status || '—')}</span></td>
          <td class="num">${x.batal ? '—' : rp(x.nilai)}</td>
          <td class="num">${x.batal ? '—' : rp(x.komisi)}</td>
        </tr>`).join('')}</tbody></table></div>`
        : `<div class="pad mini">Belum ada pasien rujukan yang tercatat.</div>`}
      <div class="pad mini" style="border-top:1px solid var(--line)">
        Halaman ini menampilkan <b>status pendaftaran</b>, bukan hasil pemeriksaan. Hasil
        laboratorium bersifat rahasia dan diserahkan langsung kepada pasien yang
        bersangkutan sesuai UU Perlindungan Data Pribadi.
      </div>
    </div>

    <div class="card">
      <h2>Riwayat Pencairan</h2>
      ${cair.length ? `<div style="overflow-x:auto"><table>
        <thead><tr><th>Tanggal</th><th>Metode</th><th>Referensi</th><th class="num">Jumlah</th></tr></thead>
        <tbody>${cair.map(c => `<tr>
          <td>${tgl(c.tanggal)}</td><td>${esc(c.metode || '—')}</td>
          <td>${esc(c.referensi || '—')}</td><td class="num">${rp(c.jumlah)}</td>
        </tr>`).join('')}</tbody></table></div>`
        : `<div class="pad mini">Belum ada pencairan. Hubungi AVA untuk mencairkan saldo Anda.</div>`}
    </div>

    <div class="mini" style="text-align:center;padding:6px 0 20px;line-height:1.6">
      Akses portal ini berlaku sampai ${tgl(d.berlaku_sampai)}.
      Jangan bagikan tautan ini — siapa pun yang memilikinya dapat melihat halaman ini.
    </div>`;
})();
</script>
</body>
</html>
