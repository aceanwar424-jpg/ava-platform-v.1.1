<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Wajib: halaman ini disajikan di akar subdomain antrian/crm,
       sedangkan berkasnya berada di /monitor/. Tanpa base, ../css/... salah arah. -->
  <base href="/monitor/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVA GLOBAL ECOSYSTEM — CRM & Sales Live Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/ava-ops-polish.css?v=20260916">
  <style>
    :root {
      --bg: #0b1120;
      --card: #151f38;
      --accent: #d4af37;
      --teal: #10b981;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --orange: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 20px 32px; gap: 20px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--accent);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); }
    .title h1 { font-size: 20px; font-weight: 800; }
    .title p { font-size: 12px; color: var(--accent); font-weight: 600; }
    .live-badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--teal);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .kpi-box {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 20px;
    }
    .kpi-box p { font-size: 13px; color: var(--text-muted); }
    .kpi-val { font-size: 32px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }

    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      min-height: 0;
    }
    .panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .panel-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; }
    
    .pipeline-bar-wrapper { margin-bottom: 20px; }
    .pipeline-bar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: #222e4c; margin: 8px 0; }
    .pipe-seg { height: 100%; }
    .legend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 3px; }

    .deals-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .deal-item {
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--teal);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deal-name { font-weight: 700; font-size: 14px; }
    .deal-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .deal-val { font-size: 16px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--teal); }
  </style>
<link rel="stylesheet" href="../css/service-design.css?v=20261007a">
</head>
<body class="ava-monitor-shell ava-service-shell">
<header><div class="brand"><img src="../css/logo-ava-global.png" alt=""><div class="title"><h1>CRM &amp; Pipeline</h1><p>Ringkasan data terverifikasi dari workspace CRM</p></div></div><span id="crm-state" class="live-badge" role="status">Belum dimuat</span></header>
<section class="panel"><form id="crm-period" style="display:flex;gap:16px;flex-wrap:wrap;align-items:end"><label>Dari tanggal<br><input id="crm-from" type="date" required></label><label>Sampai tanggal<br><input id="crm-to" type="date" required></label><button type="submit">Perbarui ringkasan</button><a href="https://ops.avahealth.sbs/#crm-pipeline">Buka workspace CRM ↗</a></form><p id="crm-message" role="status" style="margin-top:16px;line-height:1.6"></p></section>
<main id="crm-results" hidden></main>
<style>
#crm-period input,#crm-period button,#crm-period a{font:inherit;font-size:14px;min-height:44px;border-radius:6px;padding:10px 14px}
#crm-period input{background:#fff;color:#153c3d;border:1px solid #b6c8c0;margin-top:6px}
#crm-period button{background:#8fe0c1;color:#102e30;border:0;cursor:pointer;font-weight:700}
#crm-period a{color:#c4f1df;display:inline-block}#crm-results{display:grid;gap:20px}#crm-results[hidden]{display:none}
.crm-chart{list-style:none;padding:0;display:grid;gap:20px;margin-top:20px}.crm-chart li{display:grid;grid-template-columns:minmax(120px,1fr) minmax(80px,3fr) auto;gap:16px;align-items:center}.crm-track{height:20px;background:#254e50;border-radius:4px}.crm-track i{display:block;height:100%;background:#8fe0c1;border-radius:4px}.crm-chart strong{font-variant-numeric:tabular-nums}.crm-financial{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.crm-financial strong{display:block;font-size:clamp(20px,3vw,30px);margin:12px 0;overflow-wrap:anywhere}.crm-financial small{font-size:13px;color:#c8d8de}body.ava-monitor-shell{overflow:auto;height:auto;min-height:100vh}
@media(max-width:600px){.crm-financial{grid-template-columns:1fr}.crm-chart li{grid-template-columns:1fr auto}.crm-track{grid-column:1 / -1;grid-row:2}.crm-chart strong{grid-column:2;grid-row:1}}
</style>
<script src="/api/runtime-config.js"></script><script src="../js/core/api.js"></script><script src="crm.js"></script>
</body></html>
