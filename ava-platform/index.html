<script>
// ── Sidebar rail — always 64px, flyout handles submenu ──
function toggleSidebar() {
  // Mobile: toggle rail visibility (kept for compat with hamburger button)
  document.getElementById('sidebar-rail')?.classList.toggle('open');
}

// ── Date display ─────────────────────────
function updateDate() {
  const el = document.getElementById('topbar-date');
  if (!el) return;
  el.textContent = new Date().toLocaleDateString('id-ID',{
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });
}

// ── Boot ─────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  updateDate();
  setInterval(updateDate, 60000);

  // Sync token from URL query string (Single Sign-On cross-subdomain)
  const urlParams = new URLSearchParams(window.location.search);
  const qToken = urlParams.get('token') || urlParams.get('access_token');
  const qRefresh = urlParams.get('refresh') || urlParams.get('refresh_token');
  if (qToken) {
    localStorage.setItem('ol_token', qToken);
    if (qRefresh) localStorage.setItem('ol_refresh', qRefresh);
  }

  // ── Subdomain menentukan isi, bukan query string ────────────────────────
  //
  // Berkas index.html ini melayani his, lis, ops, DAN console sekaligus.
  // Yang membedakan isinya adalah host tempat ia disajikan — dibaca dari
  // js/core/peta-subdomain.js yang dibangkitkan dari config/domain.json.
  //
  // Dulu pembedanya query ?workspace= yang hanya ditempelkan simulator, dan
  // di produksi query itu tidak pernah ada — sehingga keempat subdomain
  // menampilkan seluruh 14 rel menu dan tampak persis sama.
  //
  // Urutan kewenangan: query string (untuk pengujian) → subdomain → bawaan.
  const host = window.location.hostname.toLowerCase();
  const hash = window.location.hash.toLowerCase();
  const situsIni = (typeof window.situsSaatIni === 'function') ? window.situsSaatIni() : null;

  const isLisDomain = host.startsWith('lis.') || urlParams.get('app') === 'lis'
                   || urlParams.get('preset') === 'lis' || hash === '#lab';
  const customView = urlParams.get('view');

  // Workspace efektif: dipakai untuk menyempitkan rel menu.
  const workspaceAktif = urlParams.get('workspace')
                      || (situsIni && situsIni.workspace)
                      || (hash.startsWith('#') ? hash.substring(1) : null)
                      || 'holding';

  function determineInitialPage() {
    if (customView) return customView;
    if (hash.startsWith('#')) return hash.substring(1);
    if (situsIni && situsIni.awal) return situsIni.awal;
    if (isLisDomain) return 'lab';
    return 'dashboard';
  }

  // Listener untuk perubahan hash URL saat berpindah tab di Simulator Developer
  window.addEventListener('hashchange', () => {
    const newHash = window.location.hash.toLowerCase();
    if (newHash.startsWith('#')) {
      const targetPage = newHash.substring(1);

      // Lingkup rail HANYA diubah bila hash-nya memang nama workspace.
      //
      // Sebelumnya baris ini memanggil applyWorkspaceScope(targetPage) untuk
      // hash apa pun. Nama halaman seperti 'emr-soap' tidak ada di
      // WORKSPACE_RAIL_SCOPES, sehingga fungsinya jatuh ke 'holding' dan
      // memunculkan kembali seluruh 14 rail — penyempitan per subdomain
      // hilang diam-diam begitu pengguna berpindah halaman.
      if (typeof applyWorkspaceScope === 'function'
          && typeof ruangKanonik === 'function'
          && window.PETA_MENU
          && window.PETA_MENU.ruang[ruangKanonik(targetPage)]) {
        applyWorkspaceScope(targetPage);
      }
      if (targetPage && typeof navigate === 'function') {
        navigate(targetPage);
      }
    }
  });

  const token = localStorage.getItem('ol_token');
  if (token) {
    if (token === 'master_ava_token_superadmin_all_access' || token.startsWith('master_ava_')) {
      const masterUser = {
        id: 'master-superadmin-ava',
        email: 'admin@avahealth.sbs',
        role: 'super_admin',
        user_metadata: { full_name: 'Master Super Admin', role: 'super_admin' },
        profile: { id: 'master-superadmin-ava', full_name: 'Master Super Admin', role: 'super_admin', is_superadmin: true }
      };
      window.currentUser = masterUser;
      if (typeof loadServerAccess === 'function') await loadServerAccess();
      setupAppUI();
      applyRoleMenu();
      
      if (typeof siapkanNavigasi === 'function') siapkanNavigasi(workspaceAktif);

      if (typeof injectExecToggle === 'function') setTimeout(injectExecToggle, 500);
      checkConnection();
      navigate(determineInitialPage());
      if (typeof prefetchModulUmum === 'function') prefetchModulUmum();
      setTimeout(() => { if (typeof checkMOURenewals === 'function') checkMOURenewals(); }, 2000);
      return;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { ...SB_HEADERS, 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const user = await res.json();
        if (user && user.id) {
          console.log('[BOOT DEBUG] Auth UUID:', user.id, '| Auth email:', user.email);
          window.currentUser = user;
          try {
            const profile = await sbGet('user_profiles',`select=*&id=eq.${user.id}`);
            console.log('[BOOT DEBUG] Profile query result:', profile);
            if (profile?.[0]) window.currentUser.profile = profile[0];
          } catch(e) { console.log('[BOOT DEBUG] Profile query error:', e); }
          // Hak akses diambil dari server dulu, baru menu disusun. Tanpa ini
          // menu jatuh ke matriks bawaan di berkas — bukan bahaya, tapi
          // perubahan peran oleh admin tidak akan terlihat.
          if (typeof loadServerAccess === 'function') await loadServerAccess();
          setupAppUI();
          applyRoleMenu();
          // Penyempitan rel per subdomain berlaku untuk SEMUA pengguna.
          // Sebelumnya hanya jalur master token yang memanggilnya, sehingga
          // staf biasa melihat seluruh 14 rel di his, lis, ops, dan console.
          if (typeof siapkanNavigasi === 'function') siapkanNavigasi(workspaceAktif);
          if (typeof injectExecToggle==='function') setTimeout(injectExecToggle,500);
          checkConnection();
          navigate(determineInitialPage());
          // Sesudah aplikasi diam, siapkan modul yang paling sering dibuka
          // supaya perpindahan pertama terasa seketika — tanpa membebani boot.
          if (typeof prefetchModulUmum === 'function') prefetchModulUmum();
          // Check renewals after load
          setTimeout(()=>{ if(typeof checkMOURenewals==='function') checkMOURenewals(); }, 2000);
          return;
        }
      }
    } catch(e) {}
  }

  // Tidak ada sesi sah → wajib masuk, termasuk pada engine lokal.
  // Dulu di sini ada auto-login admin untuk 127.0.0.1/localhost. Itu dihapus:
  // engine lokal kini punya autentikasi sendiri (kredensial ter-hash di DB,
  // peran dari user_profiles), sehingga pintasan apa pun sama saja dengan
  // membuka seluruh basis data klinik tanpa kata sandi.
  localStorage.removeItem('ol_token');
  localStorage.removeItem('ol_refresh');
  showLoginScreen();
});


function setupAppUI() {
  const name      = getUserName();
  const role      = getUserRole();
  const email     = window.currentUser?.email || '';
  const roleLabel = typeof getRoleLabel === 'function' ? getRoleLabel(role) : role;
  const initials  = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() || name.charAt(0).toUpperCase();
  const ROLE_COLORS = {
    super_admin:'#7B1FA2', direktur:'#0A2342', manager:'#00897B', spv:'#0E7490',
    sales:'#1565C0', operasional:'#2E7D32', hrd_staff:'#E65100',
    finance_staff:'#00838F', viewer:'#546E7A',
  };
  const roleColor = ROLE_COLORS[role] || 'var(--teal)';

  // Topbar user pill
  const topbarAvEl   = document.getElementById('topbar-avatar');
  const topbarNameEl = document.getElementById('topbar-user-name');
  const topbarRoleEl = document.getElementById('topbar-user-role');
  if (topbarAvEl)   { topbarAvEl.textContent = initials; topbarAvEl.style.background = `linear-gradient(135deg,${roleColor},${roleColor}99)`; }
  if (topbarNameEl) topbarNameEl.textContent = name;
  if (topbarRoleEl) topbarRoleEl.textContent = roleLabel;

  // Dropdown header
  const ddAvEl    = document.getElementById('dropdown-avatar');
  const ddNameEl  = document.getElementById('dropdown-name');
  const ddEmailEl = document.getElementById('dropdown-email');
  const ddRoleEl  = document.getElementById('dropdown-role-badge');
  if (ddAvEl)    { ddAvEl.textContent = initials; ddAvEl.style.background = `linear-gradient(135deg,${roleColor},${roleColor}99)`; }
  if (ddNameEl)  ddNameEl.textContent  = name;
  if (ddEmailEl) ddEmailEl.textContent = email;
  if (ddRoleEl)  ddRoleEl.innerHTML    = `<span style="background:${roleColor}20;color:${roleColor};font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">${roleLabel}</span>`;

  // Hidden sidebar refs (kept for JS compat)
  // refs already updated above

  // badge-partners-rail visibility handled by partners/index.js loadPartners()
}

async function checkConnection() {
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');
  try {
    await sbGet('partners','select=count&limit=1');
    if (dot) dot.className = 'conn-dot ok';
    if (lbl) lbl.textContent = 'Terhubung';
  } catch(e) {
    if (dot) dot.className = 'conn-dot error';
    if (lbl) lbl.textContent = 'Offline';
  }
}

setInterval(checkConnection, 60000);

// ── User Dropdown ─────────────────────────────────────
function toggleUserDropdown() {
  const dd = document.getElementById('user-dropdown');
  if (!dd) return;
  const isOpen = dd.style.display !== 'none';
  dd.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    // Close when clicking outside
    setTimeout(() => {
      document.addEventListener('click', closeDropdownOutside, {once:true});
    }, 10);
  }
}

function closeDropdownOutside(e) {
  const wrap = document.getElementById('topbar-user-wrap');
  if (wrap && !wrap.contains(e.target)) closeUserDropdown();
}

function closeUserDropdown() {
  const dd = document.getElementById('user-dropdown');
  if (dd) dd.style.display = 'none';
}

function openResetPassword() {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">🔑 Ganti Password</div>
      <button class="modal-close" onclick="closeModalForce()">✕</button>
    </div>
    <div class="form-group">
      <label>Password Baru *</label>
      <input type="password" id="rp-new" placeholder="Minimal 8 karakter">
    </div>
    <div class="form-group">
      <label>Konfirmasi Password *</label>
      <input type="password" id="rp-confirm" placeholder="Ulangi password baru">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModalForce()">Batal</button>
      <button class="btn btn-teal" onclick="doResetPassword()">🔑 Simpan Password</button>
    </div>`, 'narrow');
}

async function doResetPassword() {
  const np = document.getElementById('rp-new')?.value;
  const cp = document.getElementById('rp-confirm')?.value;
  if (!np || np.length < 8) { toast('Password minimal 8 karakter','err'); return; }
  if (np !== cp)            { toast('Password tidak cocok','err'); return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:'PUT',
      headers:{...SB_HEADERS,'Authorization':`Bearer ${getStoredToken()}`},
      body: JSON.stringify({password: np}),
    });
    if (!res.ok) throw new Error((await res.json()).message||'Gagal');
    toast('✅ Password berhasil diubah','ok');
    closeModalForce();
  } catch(e) { toast('❌ '+e.message,'err'); }
}

  const rc     = (typeof ROLES !== 'undefined' ? ROLES[role] : null) || {};

  const DEPT_OPTIONS = ['Management','Medis','Lab & Analis','Finance','CS & Ops','Support','Marketing & Sales'];

  openModal(`
    <div class="modal-header">
      <div class="modal-title">👤 Edit Profil</div>
      <button class="modal-close" onclick="closeModalForce()">✕</button>
    </div>

    <div class="status-box" style="background:var(--bg2);font-size:12px;margin-bottom:14px">
      📧 ${email} &nbsp;·&nbsp;
      <span style="color:${rc.color||'var(--teal)'};font-weight:700">● ${rc.label||role}</span>
      &nbsp;(role diatur oleh Super Admin di User Management)
    </div>

    <div class="form-group">
      <label>Nama Lengkap *</label>
      <input type="text" id="ep-name" value="${name}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Jabatan</label>
        <input type="text" id="ep-jabatan" value="${p.jabatan||''}" placeholder="Contoh: Head of Operations">
      </div>
      <div class="form-group">
        <label>Divisi / Departemen</label>
        <select id="ep-division">
          <option value="">-- Pilih --</option>
          ${DEPT_OPTIONS.map(d=>`<option value="${d}" ${p.division===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>No. HP / WA</label>
        <input type="text" id="ep-phone" value="${p.phone||''}" placeholder="08xxxxxxxxxx">
      </div>
      <div class="form-group">
        <label>NIP / Employee ID</label>
        <input type="text" id="ep-nip" value="${p.nip||''}" placeholder="Opsional">
      </div>

    <div class="form-group">
      <label>Bio Singkat</label>
      <textarea id="ep-bio" rows="2" placeholder="Deskripsi singkat peran...">${p.bio||''}</textarea>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModalForce()">Batal</button>
      <button class="btn btn-teal" onclick="doSaveProfile()">💾 Simpan Profil</button>
    </div>`, 'narrow');
}

async function refreshMyRole() {
  const userId = window.currentUser?.id;
  const userEmail = window.currentUser?.email;
  if (!userId) { toast('Session tidak valid, silakan login ulang','err'); return; }
  try {
    const fresh = await sbGet('user_profiles', `select=*&id=eq.${userId}`);
    console.log('[DEBUG] Session UUID:', userId, '| Session email:', userEmail);
    console.log('[DEBUG] DB query result:', fresh);
    if (fresh?.[0]) {
      const oldRole = getUserRole();
      window.currentUser.profile = fresh[0];
      const newRole = getUserRole();
      // Peran bisa saja baru diubah admin → ambil ulang hak akses dari server.
      if (typeof loadServerAccess === 'function') await loadServerAccess();
      setupAppUI();
      applyRoleMenu();
      if (oldRole === newRole && newRole !== 'super_admin') {
        openModal(`
          <div class="modal-header">
            <div class="modal-title">🔍 Diagnosa Role</div>
            <button class="modal-close" onclick="closeModalForce()">✕</button>
          </div>
          <div style="font-size:13px;line-height:1.7">
            <p><strong>Session login saat ini:</strong></p>
            <p>UUID: <code style="background:var(--bg2);padding:2px 6px;border-radius:4px">${userId}</code></p>
            <p>Email: <code style="background:var(--bg2);padding:2px 6px;border-radius:4px">${userEmail||'(tidak ada)'}</code></p>
            <p><strong>Hasil dari database (user_profiles):</strong></p>
            <p>Role: <code style="background:var(--bg2);padding:2px 6px;border-radius:4px">${fresh[0].role}</code></p>
            <p>Email tersimpan: <code style="background:var(--bg2);padding:2px 6px;border-radius:4px">${fresh[0].email||'(kosong)'}</code></p>
            <hr style="margin:14px 0;border:none;border-top:1px solid var(--border)">
            <p style="color:#DC2626"><strong>⚠️ Jika UUID di atas BERBEDA dari UUID Ace di SQL Editor Supabase:</strong></p>
            <p>Berarti browser ini sedang login dengan <strong>akun/session berbeda</strong> dari yang Anda update di SQL. Klik tombol di bawah untuk logout total dan login ulang dengan email Ace yang benar.</p>
          </div>
          <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModalForce()">Tutup</button>
            <button class="btn btn-danger" onclick="forceCleanLogout()">🚪 Logout Total & Bersihkan Session</button>
          </div>`, 'narrow');
      } else {
        toast(`✅ Role: "${newRole}" · UUID: ${userId.slice(0,8)}...`, 'ok', 4000);
      }
    } else {
      toast(`⚠️ TIDAK ADA baris user_profiles untuk UUID ${userId} — akun ini belum punya profile di database`, 'warn', 8000);
    }
  } catch(e) { toast('❌ '+e.message,'err'); }
}

function forceCleanLogout() {
  localStorage.clear();
  closeModalForce();
  location.reload();
}

async function doSaveProfile() {
  const name     = document.getElementById('ep-name')?.value.trim();
  const phone    = document.getElementById('ep-phone')?.value.trim();
  const jabatan  = document.getElementById('ep-jabatan')?.value.trim();
  const division = document.getElementById('ep-division')?.value;
  const nip      = document.getElementById('ep-nip')?.value.trim();
  const bio      = document.getElementById('ep-bio')?.value.trim();
  if (!name) { toast('Nama tidak boleh kosong','err'); return; }
  const userId = window.currentUser?.id;
  if (!userId) { toast('Session tidak valid','err'); return; }
  try {
    const payload = {
      full_name:  name,
      phone:      phone||null,
      jabatan:    jabatan||null,
      division:   division||null,
      nip:        nip||null,
      bio:        bio||null,
      updated_at: new Date().toISOString(),
    };
    await sbPatch('user_profiles', userId, payload);
    if (window.currentUser?.profile) {
      Object.assign(window.currentUser.profile, payload);
    }
    toast('✅ Profil diupdate','ok');
    closeModalForce();
    setupAppUI();
  } catch(e) {
    if (e.message && e.message.includes('column')) {
      toast('⚠️ Jalankan migration SQL dulu untuk field jabatan/divisi','warn',5000);
    } else {
      toast('❌ '+e.message,'err');
    }
  }
}


// ── Lingkup rel per ruang kerja ────────────────────────────────────────
//
// Daftar kategori per ruang kini berasal dari config/menu.json melalui
// window.kategoriRuang(). Sebelumnya ia berupa tabel yang ditulis tangan di
// sini, dengan kunci yang tidak pernah cocok dengan nama kategori di
// dokumen pemetaan.
//
// Nama ruang lama tetap diterima supaya tautan dan pemanggilan yang sudah
// beredar tidak mati — dipetakan ke ruang barunya.
const RUANG_ALIAS = {
  holding: 'ops',
  lab: 'lis',
  klinik: 'his',
  homecare: 'his',        // Home Care adalah layanan klinis non-lab
  fmcg: 'wellness',
  care: 'wellness',
  nutri: 'wellness',
  sanctuary: 'wellness',
  console: 'tech',
  corporate: 'his',       // MCU korporat terintegrasi utamanya ke HIS
};

function ruangKanonik(ws) {
  if (!ws) return 'ops';
  return RUANG_ALIAS[ws] || ws;
}
window.ruangKanonik = ruangKanonik;

// Menggambar ulang rel navigasi sesuai ruang. Rel yang bukan milik ruang
// itu TIDAK dibuat sama sekali — bukan dibuat lalu disembunyikan.
function applyWorkspaceScope(ws) {
  const ruang = ruangKanonik(ws);
  if (typeof gambarRail === 'function') gambarRail(ruang);

  const switcher = document.getElementById('portfolio-workspace-switcher');
  if (switcher && switcher.value !== ruang) switcher.value = ruang;
}
window.applyWorkspaceScope = applyWorkspaceScope;

// Berpindah ruang: gambar ulang rel, lalu buka halaman awal ruang itu.
//
// Halaman awal diambil dari config/menu.json (lewat peta-subdomain.js),
// bukan dari rantai if-else yang harus disunting setiap kali ada ruang baru.
function switchPortfolioWorkspace(val) {
  const ruang = ruangKanonik(val);
  applyWorkspaceScope(ruang);

  const def = (window.PETA_MENU && window.PETA_MENU.ruang && window.PETA_MENU.ruang[ruang]) || null;
  const kategoriPertama = def && def.kategori && def.kategori.length
    ? def.kategori[0]
    : (window.kategoriRuang ? window.kategoriRuang(ruang)[0] : 'utama');

  // Halaman awal: entri pertama yang benar-benar sudah ada di kategori itu.
  const kat = FLYOUT_MENUS[kategoriPertama];
  const pertama = kat && kat.items.find(function (i) { return !i.soon; });

  if (pertama && typeof navigate === 'function') {
    navigate(pertama.page);
  }
}
window.switchPortfolioWorkspace = switchPortfolioWorkspace;

// Mengisi pemilih ruang dari peta. Dipanggil saat aplikasi siap, sesudah
// peta-menu.js termuat.
function isiPemilihRuang(ruangAktif) {
  const sel = document.getElementById('portfolio-workspace-switcher');
  if (!sel || !window.PETA_MENU) return;

  const IKON = { ops: '👑', tech: '💻', his: '🩺', lis: '🔬', wellness: '🌿' };
  const daftar = Object.entries(window.PETA_MENU.ruang);

  sel.innerHTML = daftar.map(function (pair) {
    const k = pair[0], r = pair[1];
    return '<option value="' + k + '">' + (IKON[k] || '•') + ' ' + r.nama + '</option>';
  }).join('');

  const aktif = ruangKanonik(ruangAktif);
  if (window.PETA_MENU.ruang[aktif]) sel.value = aktif;
}
window.isiPemilihRuang = isiPemilihRuang;

// Menyiapkan navigasi untuk ruang tempat halaman ini disajikan.
// Satu pintu masuk supaya kedua jalur boot (master token & login biasa)
// tidak bisa mengerjakan langkah yang berbeda — persoalan yang sebelumnya
// membuat staf biasa selalu melihat seluruh rel.
function siapkanNavigasi(ws) {
  if (!menuTersusun) susunMenu();
  const ruang = ruangKanonik(ws);
  isiPemilihRuang(ruang);
  applyWorkspaceScope(ruang);
}
window.siapkanNavigasi = siapkanNavigasi;


// ═══════════════════════════════════════════════════════════════
// FLYOUT PANEL — Category Rail Navigation (Virtu Digilab style)
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// STRUKTUR MENU — dibangun dari config/menu.json
//
// Blok ini dulu berisi definisi FLYOUT_MENUS sepanjang ~240 baris yang
// ditulis tangan, sementara pemetaan yang sama juga ditulis ulang di
// LAPORAN_ARSITEKTUR_MENU_AVA_GLOBAL.md. Keduanya menyimpang: dokumennya
// menjanjikan pembagian per unit usaha, aplikasinya menampilkan semua rel
// di setiap subdomain.
//
// Sekarang keduanya lahir dari satu sumber. Bentuk objeknya sengaja
// dipertahankan persis seperti semula supaya openFlyout(), openCategory(),
// renderSubnav(), dan applyRoleMenu() tidak perlu diubah.
//
// Menu berstatus "belum" TETAP muncul, ditandai sebagai belum tersedia.
// Menyembunyikannya membuat peta kerja tampak lebih selesai daripada
// kenyataannya, dan itu persis kebiasaan yang sedang diperbaiki.
// ═══════════════════════════════════════════════════════════════
// Diisi oleh susunMenu(), BUKAN saat berkas ini diurai.
//
// peta-menu.js dimuat dengan `defer`, sehingga ia baru dijalankan SESUDAH
// seluruh skrip sebaris di halaman ini selesai. Membangun FLYOUT_MENUS
// langsung di sini menghasilkan objek kosong — window.PETA_MENU belum ada.
// Itu tidak memunculkan galat apa pun; menunya hanya diam-diam kosong.
let FLYOUT_MENUS = {};
let menuTersusun = false;

function susunMenu() {
  const sumber = (window.PETA_MENU && window.PETA_MENU.kategori) || {};
  if (!Object.keys(sumber).length) return false;

  const hasil = {};
  for (const kunci of Object.keys(sumber)) {
    const kat = sumber[kunci];
    const items = [];

    for (const grup of kat.grup || []) {
      for (const m of grup.menu || []) {
        items.push({
          page:  m.id,
          icon:  kat.ikon || 'list',
          label: m.label,
          desc:  m.ket || '',
          group: grup.nama,
          status: m.status,
          // 'soon' sudah dikenali openFlyout & renderSubnav: itemnya tampil
          // tetapi tidak bisa diklik, dengan penanda.
          soon:  m.status === 'belum',
          adminOnly: !!m.admin,
          // Banyak menu adalah tab di dalam halaman lain; aksinya disimpan
          // di sumber supaya tidak perlu ditebak dari id-nya.
          action: m.aksi || ("navigate('" + (m.rute || m.id) + "')"),
        });
      }
    }

    hasil[kunci] = {
      label:  kat.label,
      pendek: kat.pendek || kat.label,
      icon:   kat.ikon || 'home',
      items:  items,
    };
  }

  FLYOUT_MENUS = hasil;
  window.FLYOUT_MENUS = hasil;   // applyRoleMenu di modules/ membacanya
  menuTersusun = true;
  return true;
}
window.susunMenu = susunMenu;

// Menggambar rel navigasi kiri untuk ruang kerja tertentu.
//
// Hanya kategori milik ruang itu yang dibuat — bukan dibuat semua lalu
// disembunyikan. Rel yang tidak pernah ada di DOM tidak bisa muncul kembali
// karena satu pemanggilan yang keliru, yang persis pernah terjadi lewat
// listener hashchange.
// Menggambar menu vertikal lengkap di sidebar kiri untuk ruang kerja aktif.
function gambarRail(ruang) {
  if (!menuTersusun) susunMenu();
  const nav = document.getElementById('rail-nav');
  if (!nav) return;

  const boleh = (typeof window.kategoriRuang === 'function')
    ? window.kategoriRuang(ruang)
    : Object.keys(FLYOUT_MENUS);

  let html = '';
  const role = typeof getUserRole === 'function' ? getUserRole() : 'sales';
  const isSuperAdmin = role === 'super_admin';
  const allowedPages = window.roleConfig?.pages || null;

  boleh.forEach(function (k) {
    const kat = FLYOUT_MENUS[k];
    if (!kat || !kat.items || !kat.items.length) return;

    // Filter item yang boleh dilihat user
    const items = kat.items.filter(function (it) {
      if (it.adminOnly && !['super_admin','manager','direktur'].includes(role)) return false;
      if (!isSuperAdmin && allowedPages && !allowedPages.includes(it.page) && !it.soon) return false;
      return true;
    });

    if (!items.length) return;

    // Kelompokkan item berdasarkan properti group
    const groups = {};
    items.forEach(function (it) {
      const g = it.group || kat.label || 'Menu';
      if (!groups[g]) groups[g] = [];
      groups[g].push(it);
    });

    Object.entries(groups).forEach(function ([gName, gItems]) {
      html += '<div class="sidebar-group-header"><span>' + gName + '</span></div>';
      gItems.forEach(function (it) {
        const ico = typeof icon === 'function' ? icon(it.icon || 'list', 15) : '•';
        const isSoon = it.soon || it.status === 'belum';
        const aksi = isSoon
          ? "alert('Modul " + it.label.replace(/'/g, "\\'") + " sedang dalam tahap finalisasi.')"
          : it.action;

        html += '<button class="sidebar-menu-btn' + (isSoon ? ' disabled' : '') + '" data-page="' + it.page + '"' +
                ' onclick="' + aksi + '; setActiveFlyoutItem(\'' + it.page + '\')">' +
                '<span class="sidebar-menu-ico">' + ico + '</span>' +
                '<span class="sidebar-menu-label">' + it.label + '</span>' +
                (isSoon ? '<span class="sidebar-soon-tag">soon</span>' : '') +
                '</button>';
      });
    });
  });

  nav.innerHTML = html;

  // Sorot halaman aktif yang sedang dibuka
  if (window.currentPage) {
    syncFlyoutToPage(window.currentPage);
  }
}
window.gambarRail = gambarRail;

function setActiveFlyoutItem(page) {
  window.currentPage = page;
  document.querySelectorAll('.sidebar-menu-btn').forEach(function (b) {
    b.classList.remove('active');
  });
  const activeBtn = document.querySelector('.sidebar-menu-btn[data-page="' + page + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    const label = activeBtn.querySelector('.sidebar-menu-label')?.textContent;
    const titleEl = document.getElementById('topbar-title');
    if (titleEl && label) titleEl.textContent = label;
  }
}

// Menyelaraskan menu aktif di sidebar saat berpindah halaman via navigate()
function syncFlyoutToPage(page) {
  window.currentPage = page;
  document.querySelectorAll('.sidebar-menu-btn').forEach(function (b) {
    b.classList.remove('active');
  });
  const activeBtn = document.querySelector('.sidebar-menu-btn[data-page="' + page + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    const label = activeBtn.querySelector('.sidebar-menu-label')?.textContent;
    const titleEl = document.getElementById('topbar-title');
    if (titleEl && label) titleEl.textContent = label;
  }
}

// ══════════════════════════════════════════════════════════════
// KATEGORI: halaman indeks + pintasan atas (pengganti flyout)
// ══════════════════════════════════════════════════════════════

// Isi ikon rail dari definisi kategori (dipanggil saat halaman siap)
function paintRailIcons() {
  document.querySelectorAll('.rail-icon[data-icon]').forEach(el => {
    const cat = el.getAttribute('data-icon');
    const name = FLYOUT_MENUS[cat]?.icon || 'home';
    el.innerHTML = typeof icon === 'function' ? icon(name, 20) : '';
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintRailIcons);
else paintRailIcons();

// Item yang boleh dilihat user berdasarkan role
function visibleCategoryItems(cat) {
  const menu = FLYOUT_MENUS[cat];
  if (!menu) return [];
  const role = typeof getUserRole === 'function' ? getUserRole() : 'sales';
  const allowedPages = window.roleConfig?.pages || null;
  const isSuperAdmin = role === 'super_admin';
  return menu.items.filter(item => {
    if (item.adminOnly && !['super_admin','manager','direktur'].includes(role)) return false;
    if (!isSuperAdmin && allowedPages && !allowedPages.includes(item.page) && !item.soon) return false;
    return true;
  });
}

// Pintasan horizontal dinonaktifkan — menu sekarang terpusat di sidebar kiri
function renderSubnav(cat, activePage) {
  const el = document.getElementById('subnav');
  if (el) {
    el.classList.remove('show');
    el.innerHTML = '';
  }
}

// Kategori yang menampilkan ringkasan angka (KPI) di halaman indeksnya.
// Nilai = nama fungsi global yang mengisi #cat-summary.
const CATEGORY_SUMMARY = { lis: 'labCategorySummary' };

// Halaman indeks kategori — daftar submenu dikelompokkan
function openCategory(cat) {
  if (cat === 'agentic') {
    navigate('agentic');
    return;
  }
  const menu = FLYOUT_MENUS[cat];
  if (!menu) return;
  activeFlyoutCat = cat;
  window.currentPage = '';
  closeFlyout();

  document.querySelectorAll('.rail-item').forEach(b => b.classList.remove('active'));
  document.querySelector(`.rail-item[data-cat="${cat}"]`)?.classList.add('active');

  const titleEl = document.getElementById('topbar-title');
  if (titleEl) titleEl.textContent = menu.label;

  if (window.innerWidth < 768) document.getElementById('sidebar-rail')?.classList.remove('open');

  const items = visibleCategoryItems(cat);
  renderSubnav(cat, null);

  const main = document.getElementById('main-content');
  if (!main) return;
  if (!items.length) {
    main.innerHTML = `<div class="empty-state" style="min-height:60vh"><div class="ico">🔒</div>
      <h3>Tidak ada menu yang tersedia</h3><p>Role Anda belum memiliki akses ke kategori ini.</p></div>`;
    return;
  }

  // Kelompokkan berdasarkan properti group; tanpa group → satu daftar
  const groups = {};
  items.forEach(it => { const g = it.group || 'Menu'; (groups[g] = groups[g] || []).push(it); });

  main.innerHTML = `
    <div class="cat-page">
      <header class="cat-head">
        <p class="cat-eyebrow">Kategori</p>
        <h1 class="cat-title">${menu.label}</h1>
        <p class="cat-sub">${items.length} menu tersedia${Object.keys(groups).length>1?` dalam ${Object.keys(groups).length} kelompok`:''}</p>
      </header>
      ${CATEGORY_SUMMARY[cat]?`<section class="cat-summary" style="margin-bottom:22px"><div id="cat-summary"></div></section>`:''}
      ${Object.entries(groups).map(([gname, gitems]) => `
        <section class="cat-group">
          ${Object.keys(groups).length>1?`<h2 class="cat-group-name">${gname}</h2>`:''}
          <div class="cat-grid">
            ${gitems.map(it => it.soon
              ? `<div class="cat-card disabled">
                   <span class="cat-card-ico">${icon(it.icon,18)}</span>
                   <div class="cat-card-body">
                     <div class="cat-card-label">${it.label}<span class="cat-card-soon">segera</span></div>
                     ${it.desc?`<div class="cat-card-desc">${it.desc}</div>`:''}
                   </div>
                 </div>`
              : `<button class="cat-card" onclick="${it.action};setActiveFlyoutItem('${it.page}')">
                   <span class="cat-card-ico">${icon(it.icon,18)}</span>
                   <div class="cat-card-body">
                     <div class="cat-card-label">${it.label}</div>
                     ${it.desc?`<div class="cat-card-desc">${it.desc}</div>`:''}
                   </div>
                   <span class="cat-card-go" aria-hidden="true">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                       stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                   </span>
                 </button>`
            ).join('')}
          </div>
        </section>`).join('')}
    </div>`;

  // Ringkasan angka (KPI) khusus kategori tertentu — diisi setelah kartu tampil.
  const summaryFn = CATEGORY_SUMMARY[cat];
  if (summaryFn && typeof window[summaryFn] === 'function') window[summaryFn]('cat-summary');
}

</script>
