<script>
// ── Sidebar drawer — satu pintu untuk desktop/mobile ───────────────────────
function setSidebarOpen(isOpen) {
  const rail = document.getElementById('sidebar-rail');
  const scrim = document.getElementById('sidebar-scrim');
  if (!rail) return;
  rail.classList.toggle('open', !!isOpen);
  scrim?.classList.toggle('open', !!isOpen);
  scrim?.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
}
window.setSidebarOpen = setSidebarOpen;

function setSidebarExpanded(isExpanded, persist = true) {
  const rail = document.getElementById('sidebar-rail');
  // Desktop HIS memakai rail ikon permanen. Label/layer menu hidup di panel
  // konteks, sehingga "expand" lama tidak lagi mengubah lebar layout.
  const expand = false;
  document.body.classList.remove('sidebar-expanded');
  rail?.classList.remove('expanded');
  document.querySelectorAll('.sidebar-expand-control').forEach((btn) => {
    btn.setAttribute('aria-label', 'Buka atau tutup menu');
    btn.setAttribute('title', 'Buka atau tutup menu');
  });
  if (persist) localStorage.removeItem('ava_sidebar_expanded');
}
window.setSidebarExpanded = setSidebarExpanded;

function toggleSidebar() {
  if (window.innerWidth >= 769) {
    const panel = document.getElementById('navigation-context');
    if (panel?.classList.contains('open')) {
      closeNavigationContext();
      return;
    }
    const activeId = window.activeNavigationContext?.groupId ||
      (window.navigationMenuGroups || []).find((group) =>
        group.services.some((service) => service.items.some((item) => item.page === window.currentPage)))?.id ||
      window.navigationMenuGroups?.[0]?.id;
    if (activeId) openNavigationContext(activeId);
    return;
  }
  const rail = document.getElementById('sidebar-rail');
  setSidebarOpen(!rail?.classList.contains('open'));
}
window.toggleSidebar = toggleSidebar;

// ── Date display ─────────────────────────
function updateDate() {
  const el = document.getElementById('topbar-date');
  if (!el) return;
  el.textContent = new Date().toLocaleDateString('id-ID',{
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });
}

// ── Boot ─────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  // Desktop dimulai hemat ruang (hanya ikon). Pilihan pengguna diingat di
  // browser ini; drawer pada layar kecil selalu mengikuti mekanisme mobile.
  if (window.innerWidth >= 769) {
    setSidebarExpanded(localStorage.getItem('ava_sidebar_expanded') === '1', false);
  }
  updateDate();
  setInterval(updateDate, 60000);

  // Sync token from URL query string (Single Sign-On cross-subdomain)
  const urlParams = new URLSearchParams(window.location.search);
  const qToken = urlParams.get('token') || urlParams.get('access_token');
  const qRefresh = urlParams.get('refresh') || urlParams.get('refresh_token');
  if (qToken) {
    localStorage.setItem('ol_token', qToken);
    if (qRefresh) localStorage.setItem('ol_refresh', qRefresh);
  }

  // ── Subdomain menentukan isi, bukan query string ────────────────────────
  //
  // Berkas index.html ini melayani his, lis, ops, DAN console sekaligus.
  // Yang membedakan isinya adalah host tempat ia disajikan — dibaca dari
  // js/core/peta-subdomain.js yang dibangkitkan dari config/domain.json.
  //
  // Dulu pembedanya query ?workspace= yang hanya ditempelkan simulator, dan
  // di produksi query itu tidak pernah ada — sehingga keempat subdomain
  // menampilkan seluruh 14 rel menu dan tampak persis sama.
  //
  // Urutan kewenangan: query string (untuk pengujian) → subdomain → bawaan.
  const host = window.location.hostname.toLowerCase();
  const hash = window.location.hash.toLowerCase();
  const situsIni = (typeof window.situsSaatIni === 'function') ? window.situsSaatIni() : null;

  const isLisDomain = host.startsWith('lis.') || host.startsWith('lab.') || urlParams.get('app') === 'lis'
                   || urlParams.get('preset') === 'lis' || hash === '#lab';
  const isHisDomain = host.startsWith('his.') || urlParams.get('app') === 'his';
  const isTechDomain = host.startsWith('tech.') || host.startsWith('console.') || urlParams.get('app') === 'tech';
  const isWellnessDomain = host.startsWith('wellness.') || host.startsWith('care.') || host.startsWith('nutri.') || host.startsWith('sanctuary.') || urlParams.get('app') === 'wellness';
  const isOpsDomain = host.startsWith('ops.') || urlParams.get('app') === 'ops';

  const customView = urlParams.get('view');

  const defaultSubdomainWorkspace = isLisDomain ? 'lis'
                                 : isHisDomain ? 'his'
                                 : isTechDomain ? 'tech'
                                 : isWellnessDomain ? 'wellness'
                                 : isOpsDomain ? 'ops'
                                 : 'lis';

  // Workspace efektif: dipakai untuk menyempitkan rel menu.
  const workspaceAktif = urlParams.get('workspace')
                      || (situsIni && situsIni.workspace)
                      || defaultSubdomainWorkspace;

  // Tombol yang selalu tampak di bawah rail harus mengikuti ruang kerja.
  // Sebelumnya HIS, Tech, Wellness, dan OPS sama-sama membawa pengguna ke
  // konfigurasi connector LIS (:9999). Selain membingungkan, itu membuka
  // konteks operasional yang tidak relevan bagi staf klinis. Konfigurasi
  // umum tetap melewati router/RBAC; hanya target pintasannya yang berubah.
  function sesuaikanChromeRuangKerja(ruang) {
    const opsi = {
      lis:      { halaman: 'lis-settings', label: 'Pengaturan & LIS Connector', tag: 'ISO 15189:2022' },
      his:      { halaman: 'settings',     label: 'Pengaturan Sistem HIS',     tag: 'HIS / RME' },
      tech:     { halaman: 'settings',     label: 'Pengaturan Platform',       tag: 'AVA TECH' },
      wellness: { halaman: 'settings',     label: 'Pengaturan Wellness',       tag: 'WELLNESS' },
      ops:      { halaman: 'settings',     label: 'Pengaturan Holding',        tag: 'AVA GLOBAL' }
    }[ruang] || { halaman: 'settings', label: 'Pengaturan Sistem', tag: 'AVA ENGINE' };

    const tombol = document.getElementById('workspace-settings-btn');
    const label = document.getElementById('workspace-settings-label');
    const tag = document.getElementById('sidebar-brand-tag');

    if (label) label.textContent = opsi.label;
    if (tag) tag.textContent = opsi.tag;
    if (tombol) {
      tombol.title = opsi.label;
      tombol.onclick = () => navigate(opsi.halaman, opsi.halaman === 'settings' ? { tab: 'general' } : {});
    }
  }

  function determineInitialPage() {
    if (customView) return customView;
    if (hash.startsWith('#')) return hash.substring(1);
    if (situsIni && situsIni.awal) return situsIni.awal;
    if (isLisDomain) return 'lab';
    if (isHisDomain) return 'emr-soap';
    if (isTechDomain) return 'saas-console';
    return 'dashboard';
  }

  // Listener untuk perubahan hash URL saat berpindah tab di Simulator Developer
  window.addEventListener('hashchange', () => {
    const newHash = window.location.hash.toLowerCase();
    if (newHash.startsWith('#')) {
      const targetPage = newHash.substring(1);

      // Lingkup rail HANYA diubah bila hash-nya memang nama workspace.
      //
      // Sebelumnya baris ini memanggil applyWorkspaceScope(targetPage) untuk
      // hash apa pun. Nama halaman seperti 'emr-soap' tidak ada di
      // WORKSPACE_RAIL_SCOPES, sehingga fungsinya jatuh ke 'holding' dan
      // memunculkan kembali seluruh 14 rail — penyempitan per subdomain
      // hilang diam-diam begitu pengguna berpindah halaman.
      if (typeof applyWorkspaceScope === 'function'
          && typeof ruangKanonik === 'function'
          && window.PETA_MENU
          && window.PETA_MENU.ruang[ruangKanonik(targetPage)]) {
        applyWorkspaceScope(targetPage);
      }
      if (targetPage && typeof navigate === 'function') {
        navigate(targetPage);
      }
    }
  });

  const token = localStorage.getItem('ol_token');
  const demoLokal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.localhost');
  if (token) {
    if (demoLokal && (token === 'master_ava_token_superadmin_all_access' || token.startsWith('master_ava_'))) {
      const masterUser = {
        id: 'master-superadmin-ava',
        email: 'admin@avahealth.sbs',
        role: 'super_admin',
        user_metadata: { full_name: 'Master Super Admin', role: 'super_admin' },
        profile: { id: 'master-superadmin-ava', full_name: 'Master Super Admin', role: 'super_admin', is_superadmin: true }
      };
      window.currentUser = masterUser;
      if (typeof loadServerAccess === 'function') await loadServerAccess();
      setupAppUI();
      applyRoleMenu();
      
      if (typeof siapkanNavigasi === 'function') siapkanNavigasi(workspaceAktif);
      sesuaikanChromeRuangKerja(workspaceAktif);

      if (typeof injectExecToggle === 'function') setTimeout(injectExecToggle, 500);
      checkConnection();
      navigate(determineInitialPage());
      if (typeof prefetchModulUmum === 'function') prefetchModulUmum();
      setTimeout(() => { if (typeof checkMOURenewals === 'function') checkMOURenewals(); }, 2000);
      return;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { ...SB_HEADERS, 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const user = await res.json();
        if (user && user.id) {
          console.log('[BOOT DEBUG] Auth UUID:', user.id, '| Auth email:', user.email);
          window.currentUser = user;
          try {
            const profile = await sbGet('user_profiles',`select=*&id=eq.${user.id}`);
            console.log('[BOOT DEBUG] Profile query result:', profile);
            if (profile?.[0]) window.currentUser.profile = profile[0];
          } catch(e) { console.log('[BOOT DEBUG] Profile query error:', e); }
          // Hak akses diambil dari server dulu, baru menu disusun. Tanpa ini
          // menu jatuh ke matriks bawaan di berkas — bukan bahaya, tapi
          // perubahan peran oleh admin tidak akan terlihat.
          if (typeof loadServerAccess === 'function') await loadServerAccess();
          setupAppUI();
          applyRoleMenu();
          // Penyempitan rel per subdomain berlaku untuk SEMUA pengguna.
          // Sebelumnya hanya jalur master token yang memanggilnya, sehingga
          // staf biasa melihat seluruh 14 rel di his, lis, ops, dan console.
          if (typeof siapkanNavigasi === 'function') siapkanNavigasi(workspaceAktif);
          sesuaikanChromeRuangKerja(workspaceAktif);
          if (typeof injectExecToggle==='function') setTimeout(injectExecToggle,500);
          checkConnection();
          navigate(determineInitialPage());
          // Sesudah aplikasi diam, siapkan modul yang paling sering dibuka
          // supaya perpindahan pertama terasa seketika — tanpa membebani boot.
          if (typeof prefetchModulUmum === 'function') prefetchModulUmum();
          // Check renewals after load
          setTimeout(()=>{ if(typeof checkMOURenewals==='function') checkMOURenewals(); }, 2000);
          return;
        }
      }
    } catch(e) {}
  }

  // Tidak ada sesi sah → wajib masuk, termasuk pada engine lokal.
  // Dulu di sini ada auto-login admin untuk 127.0.0.1/localhost. Itu dihapus:
  // engine lokal kini punya autentikasi sendiri (kredensial ter-hash di DB,
  // peran dari user_profiles), sehingga pintasan apa pun sama saja dengan
  // membuka seluruh basis data klinik tanpa kata sandi.
  localStorage.removeItem('ol_token');
  localStorage.removeItem('ol_refresh');
  showLoginScreen();
});

async function doSaveProfile() {
  const name     = document.getElementById('ep-name')?.value.trim();
  const phone    = document.getElementById('ep-phone')?.value.trim();
  const jabatan  = document.getElementById('ep-jabatan')?.value.trim();
  const division = document.getElementById('ep-division')?.value;
  const nip      = document.getElementById('ep-nip')?.value.trim();
  const bio      = document.getElementById('ep-bio')?.value.trim();
  if (!name) { toast('Nama tidak boleh kosong','err'); return; }
  const userId = window.currentUser?.id;
  if (!userId) { toast('Session tidak valid','err'); return; }
  try {
    const payload = {
      full_name:  name,
      phone:      phone||null,
      jabatan:    jabatan||null,
      division:   division||null,
      nip:        nip||null,
      bio:        bio||null,
      updated_at: new Date().toISOString(),
    };
    await sbPatch('user_profiles', userId, payload);
    if (window.currentUser?.profile) {
      Object.assign(window.currentUser.profile, payload);
    }
    toast('✅ Profil diupdate','ok');
    closeModalForce();
    setupAppUI();
  } catch(e) {
    if (e.message && e.message.includes('column')) {
      toast('⚠️ Jalankan migration SQL dulu untuk field jabatan/divisi','warn',5000);
    } else {
      toast('❌ '+e.message,'err');
    }
  }
}

// FLYOUT PANEL — Category Rail Navigation (Virtu Digilab style)
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// STRUKTUR MENU — dibangun dari config/menu.json
//
// Blok ini dulu berisi definisi FLYOUT_MENUS sepanjang ~240 baris yang
// ditulis tangan, sementara pemetaan yang sama juga ditulis ulang di
// LAPORAN_ARSITEKTUR_MENU_AVA_GLOBAL.md. Keduanya menyimpang: dokumennya
// menjanjikan pembagian per unit usaha, aplikasinya menampilkan semua rel
// di setiap subdomain.
//
// Sekarang keduanya lahir dari satu sumber. Bentuk objeknya sengaja
// dipertahankan persis seperti semula supaya openFlyout(), openCategory(),
// renderSubnav(), dan applyRoleMenu() tidak perlu diubah.
//
// Menu berstatus "belum" TETAP muncul, ditandai sebagai belum tersedia.
// Menyembunyikannya membuat peta kerja tampak lebih selesai daripada
// kenyataannya, dan itu persis kebiasaan yang sedang diperbaiki.
// ═══════════════════════════════════════════════════════════════
// Diisi oleh susunMenu(), BUKAN saat berkas ini diurai.
//
// peta-menu.js dimuat dengan `defer`, sehingga ia baru dijalankan SESUDAH
// seluruh skrip sebaris di halaman ini selesai. Membangun FLYOUT_MENUS
// langsung di sini menghasilkan objek kosong — window.PETA_MENU belum ada.
// Itu tidak memunculkan galat apa pun; menunya hanya diam-diam kosong.
let FLYOUT_MENUS = {};
let menuTersusun = false;

function susunMenu() {
  const sumber = (window.PETA_MENU && window.PETA_MENU.kategori) || {};
  if (!Object.keys(sumber).length) return false;

  const hasil = {};
  for (const kunci of Object.keys(sumber)) {
    const kat = sumber[kunci];
    const items = [];

    for (const grup of kat.grup || []) {
      for (const m of grup.menu || []) {
        items.push({
          page:  m.id,
          icon:  kat.ikon || 'list',
          label: m.label,
          desc:  m.ket || '',
          group: grup.nama,
          status: m.status,
          // 'soon' sudah dikenali openFlyout & renderSubnav: itemnya tampil
          // tetapi tidak bisa diklik, dengan penanda.
          soon:  m.status === 'belum',
          adminOnly: !!m.admin,
          // Banyak menu adalah tab di dalam halaman lain; aksinya disimpan
          // di sumber supaya tidak perlu ditebak dari id-nya.
          action: m.aksi || ("navigate('" + (m.rute || m.id) + "')"),
        });
      }
    }

    hasil[kunci] = {
      label:  kat.label,
      pendek: kat.pendek || kat.label,
      icon:   kat.ikon || 'home',
      items:  items,
    };
  }

  FLYOUT_MENUS = hasil;
  window.FLYOUT_MENUS = hasil;   // applyRoleMenu di modules/ membacanya
  menuTersusun = true;
  return true;
}
window.susunMenu = susunMenu;

      // jenis registrasi agar operator tidak mengira ia adalah tipe registrasi.
      appointments: ['Alur Pasien', 'Jadwal & Perjanjian'],
      'admission-report': ['Alur Pasien', 'Back Office'],
      queue: ['Alur Pasien', 'Queue'],
      'queue-console': ['Alur Pasien', 'Queue'],
      'queue-kiosk': ['Alur Pasien', 'Queue'],
      'queue-outpatient': ['Alur Pasien', 'Queue Outpatient'],
      // Definisi flow/loket/perangkat adalah konfigurasi, bukan pekerjaan
      // harian loket. Operasionalnya tetap ada di kelompok Queue di atas.
      'queue-config': ['Administrasi Sistem', 'Konfigurasi Antrean'],
      'hc-schedule': ['Fasilitas & Antrean', 'Jadwal & Kapasitas'],
      'hc-staff': ['Fasilitas & Antrean', 'Tenaga & Penugasan'],
      satusehat: ['Administrasi & Kepatuhan', 'Integrasi & SATUSEHAT'],
      'bpjs-claim': ['Administrasi & Kepatuhan', 'Integrasi & Klaim'],
      'rl-reports': ['Administrasi & Kepatuhan', 'Integrasi & Klaim']
    };
    if (masterPlacement[item.page]) return masterPlacement[item.page];
    const peta = {
      his: {
        'Alur Pasien': ['Alur Pasien', 'Pendaftaran, Jadwal & Antrean'],
        'Pelayanan Klinis': ['Pelayanan Klinis', 'Konsultasi, EMR & Rawat Inap'],
        'Gawat Darurat & Keselamatan Pasien': ['Pelayanan Klinis', 'IGD & Keselamatan Pasien'],
        'Farmasi': ['Pelayanan Klinis', 'Farmasi & Resep'],
        'Home Care': ['Pelayanan Klinis', 'Home Care'],
        'Kepatuhan & Klaim': ['Administrasi & Kepatuhan', 'Klaim, Integrasi & Rekam Medis']
      },
      radiologi: { '*': ['Pelayanan Klinis', 'Radiologi & Pencitraan'] },
      'support-medical': { '*': ['Pelayanan Klinis', grup] },
      avahealth: { '*': ['Operasional Klinik', labelKategori] },
      korporat: { '*': ['Bisnis & Korporat', labelKategori] },
      marketing: { '*': ['Bisnis & Korporat', labelKategori] },
      keuangan: { '*': ['Keuangan & Penagihan', grup] },
      mutu: { '*': ['Administrasi & Kepatuhan', grup] },
      sdm: { '*': ['Administrasi Sistem', 'SDM & ' + grup] },
      konfigurasi: { '*': ['Administrasi Sistem', 'Pengaturan Sistem'] }
    };
    const hasil = peta[kategori]?.[grup] || peta[kategori]?.['*'];
    return hasil || [grup, null];
  };

  const railGroups = [];
  const railByName = new Map();
  const addService = (namaGroup, namaLayanan, items, iconKategori) => {
    let group = railByName.get(namaGroup);
    if (!group) {
      group = { name: namaGroup, icon: GROUP_ICONS[namaGroup] || iconKategori || '📁', services: [] };
      railByName.set(namaGroup, group);
      railGroups.push(group);
    }
    let service = group.services.find(x => x.name === namaLayanan);
    if (!service) {
      service = { name: namaLayanan, items: [] };
      group.services.push(service);
    }
    service.items.push(...items);
  };

  boleh.forEach((k) => {
    const kat = FLYOUT_MENUS[k];
    if (!kat?.items?.length) return;
    const visible = kat.items.filter((it) => {
      if (it.adminOnly && !['super_admin', 'manager', 'direktur'].includes(role)) return false;
      return !(!isSuperAdmin && allowedPages && !allowedPages.includes(it.page) && !it.soon);
    });
    const bySourceGroup = {};
    visible.forEach((it) => {
      const sumber = it.group || kat.label || 'Menu Utama';
      (bySourceGroup[sumber] ||= []).push(it);
    });
    Object.entries(bySourceGroup).forEach(([sumber, items]) => {
      const iconKategori = typeof icon === 'function' ? icon(kat.icon || 'list', 15) : '📁';
      if (ruang === 'his') {
        items.forEach((it) => {
          const [domain, layanan] = hisPlacement(k, sumber, kat.label, it);
          addService(domain, layanan, [it], iconKategori);
        });
        return;
      }
      addService(sumber, null, items, iconKategori);
    });
  });

  // Rail hanya menampilkan domain. Rincian layanan dan modul dibuka pada
  // panel konteks dua kolom di sebelah kanan rail, bukan ditumpuk vertikal.
  // Ini menjaga struktur domain → layanan → modul tanpa mengubah route/RBAC.
  window.navigationMenuGroups = railGroups.map((group, index) => ({ ...group, id: 'nav-group-' + index }));
  const escapeNavHtml = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[char]));
  nav.innerHTML = window.navigationMenuGroups.map((group) => {
    const hasActiveChild = group.services.flatMap(x => x.items).some(it => it.page === currentPage);
    return '<div class="sidebar-accordion-group' + (hasActiveChild ? ' active-context' : '') + '" id="' + group.id + '">' +
      '<button type="button" class="sidebar-main-btn' + (hasActiveChild ? ' active-group' : '') + '" title="' + escapeNavHtml(group.name) + '" aria-expanded="false" onclick="openNavigationContext(\'' + group.id + '\')">' +
      '<span class="sidebar-main-left"><span class="sidebar-main-ico">' + group.icon + '</span><span class="sidebar-main-label">' + escapeNavHtml(group.name) + '</span></span>' +
      '<span class="sidebar-chevron" aria-hidden="true">›</span></button></div>';
  }).join('');
  // Satu-satunya inventaris yang dipakai pemilih modul. Item dibentuk sesudah
  // penyaringan role, sehingga pencarian tidak pernah membocorkan menu yang
  // tidak boleh diakses pengguna ini.
  window.modulePickerItems = window.navigationMenuGroups.flatMap(group => group.services.flatMap(service =>
    service.items.map(item => ({
      ...item,
      domain: group.name,
      service: service.name || '',
      groupIcon: group.icon
    }))
  ));
  if (window.currentPage) syncFlyoutToPage(window.currentPage);
}
window.gambarRail = gambarRail;

function updateBreadcrumb(page) {
  const domainEl = document.getElementById('breadcrumb-domain');
  const serviceEl = document.getElementById('breadcrumb-service');
  const serviceWrap = document.getElementById('breadcrumb-service-wrap');
  const pageWrap = document.getElementById('breadcrumb-page-wrap');
  const item = (window.modulePickerItems || []).find(x => x.page === page);
  if (!item) {
    if (domainEl) domainEl.textContent = page === 'dashboard' ? 'Beranda' : 'Sistem';
    if (serviceWrap) serviceWrap.hidden = true;
    if (pageWrap) pageWrap.hidden = page === 'dashboard';
    return;
  }
  if (domainEl) domainEl.textContent = item.domain;
  if (serviceEl) serviceEl.textContent = item.service;
  if (serviceWrap) serviceWrap.hidden = !item.service;
  if (pageWrap) pageWrap.hidden = false;
}
window.updateBreadcrumb = updateBreadcrumb;

function modulePickerMatches(query) {
  const needle = String(query || '').trim().toLocaleLowerCase('id-ID');
  const source = window.modulePickerItems || [];
  if (!needle) return source;
  return source.filter(item => [item.label, item.desc, item.domain, item.service]
    .filter(Boolean).join(' ').toLocaleLowerCase('id-ID').includes(needle));
}

function renderModulePicker(query = '') {
  const target = document.getElementById('module-picker-results');
  if (!target) return;
  const matches = modulePickerMatches(query);
  if (!matches.length) {
    target.innerHTML = '<div class="module-picker-empty"><span>⌕</span><strong>Menu tidak ditemukan</strong><p>Coba gunakan nama layanan atau proses yang lebih umum.</p></div>';
    return;
  }
  target.innerHTML = matches.map((item, index) => {
    const unavailable = item.soon || item.status === 'belum';
    return '<button type="button" class="module-picker-item' + (unavailable ? ' disabled' : '') + '" data-picker-index="' + index + '"' +
      (unavailable ? ' disabled' : ' onclick="modulePickerNavigate(\'' + item.page + '\')"') + '>' +
      '<span class="module-picker-item-icon">' + item.groupIcon + '</span>' +
      '<span class="module-picker-item-body"><strong>' + item.label + '</strong><small>' + item.domain + (item.service ? ' <b>›</b> ' + item.service : '') + '</small></span>' +
      (unavailable ? '<span class="module-picker-item-state">segera</span>' : '<span class="module-picker-item-go" aria-hidden="true">›</span>') +
      '</button>';
  }).join('');
}
window.filterModulePicker = function filterModulePicker(query) { renderModulePicker(query); };

function openModulePicker() {
  const overlay = document.getElementById('module-picker-overlay');
  const input = document.getElementById('module-picker-input');
  if (!overlay || !input) return;
  renderModulePicker('');
  input.value = '';
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  setTimeout(() => input.focus(), 0);
}
window.openModulePicker = openModulePicker;

function closeModulePicker(event) {
  if (event && event.target !== event.currentTarget) return;
  const overlay = document.getElementById('module-picker-overlay');
  overlay?.classList.remove('open');
  overlay?.setAttribute('aria-hidden', 'true');
}
window.closeModulePicker = closeModulePicker;

function modulePickerNavigate(page) {
  const item = (window.modulePickerItems || []).find(x => x.page === page);
  if (!item || item.soon || item.status === 'belum') return;
  closeModulePicker();
  // Aksi berasal dari manifest lokal yang sama dengan sidebar, bukan input
  // pengguna; ini menjaga perilaku rute lama tanpa menduplikasi router.
  Function(item.action)();
  setActiveFlyoutItem(page);
}
window.modulePickerNavigate = modulePickerNavigate;

document.addEventListener('keydown', (event) => {
  const overlay = document.getElementById('module-picker-overlay');
  if (overlay?.classList.contains('open') && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
    const buttons = [...document.querySelectorAll('.module-picker-item:not(.disabled)')];
    if (buttons.length) {
      event.preventDefault();
      const current = buttons.indexOf(document.activeElement);
      const next = event.key === 'ArrowDown'
        ? buttons[(current + 1 + buttons.length) % buttons.length]
        : buttons[(current - 1 + buttons.length) % buttons.length];
      next.focus();
    }
    return;
  }
  if (event.key === 'Escape' && overlay?.classList.contains('open')) {
    event.preventDefault();
    closeModulePicker();
    return;
  }
  if (event.key === 'Escape' && document.getElementById('navigation-context')?.classList.contains('open')) {
    event.preventDefault();
    closeNavigationContext();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    openModulePicker();
  }
});

function navEscapeHtml(value) {
  return String(value || '').replace(/[&<>'"]/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[char]));
}

function findNavigationGroup(groupId) {
  return (window.navigationMenuGroups || []).find((group) => group.id === groupId) || null;
}

function activeNavigationServiceIndex(group) {
  const page = window.currentPage || '';
  const found = group.services.findIndex((service) => service.items.some((item) => item.page === page));
  return found >= 0 ? found : 0;
}

function renderNavigationContext(groupId, preferredServiceIndex) {
  const group = findNavigationGroup(groupId);
  const servicesEl = document.getElementById('navigation-context-services');
  const modulesEl = document.getElementById('navigation-context-modules');
  if (!group || !servicesEl || !modulesEl) return;

  const serviceIndex = Number.isInteger(preferredServiceIndex)
    ? Math.max(0, Math.min(preferredServiceIndex, group.services.length - 1))
    : activeNavigationServiceIndex(group);
  const service = group.services[serviceIndex] || { name: 'Menu', items: [] };
  window.activeNavigationContext = { groupId, serviceIndex };

  document.getElementById('navigation-context-icon').textContent = group.icon;
  document.getElementById('navigation-context-title').textContent = group.name;
  servicesEl.innerHTML = '<p class="navigation-context-label">SUB-MENU</p>' + group.services.map((entry, index) => {
    const isActive = index === serviceIndex;
    return '<button type="button" class="navigation-service-card' + (isActive ? ' active' : '') + '" aria-pressed="' + isActive + '" onclick="selectNavigationService(\'' + groupId + '\',' + index + ')">' +
      '<span class="navigation-service-card-title">' + navEscapeHtml(entry.name || 'Menu') + '</span>' +
      '<span class="navigation-service-card-meta"><span>' + entry.items.length + ' menu</span><span aria-hidden="true">›</span></span></button>';
  }).join('');

  modulesEl.innerHTML = '<div class="navigation-context-module-head"><div><p>MENU ' + navEscapeHtml(service.name || 'UTAMA') + '</p><h3>' + navEscapeHtml(service.name || 'Menu') + '</h3></div><span>' + service.items.length + ' item</span></div>' +
    '<div class="navigation-module-list">' + service.items.map((item, index) => {
      const unavailable = item.soon || item.status === 'belum';
      const partial = item.status === 'parsial';
      const active = item.page === window.currentPage;
      // Status progres tidak ditampilkan sebagai label tahap pada navigasi.
      // Arahkan pengguna ke modul yang memang sudah bisa dibuka; penanda
      // "Segera" dipertahankan hanya untuk modul yang benar-benar belum ada.
      const state = unavailable ? '<span class="navigation-module-state">Segera</span>' : '<span class="navigation-module-go" aria-hidden="true">›</span>';
      return '<button type="button" class="navigation-module-item' + (active ? ' active' : '') + (partial ? ' partial' : '') + (unavailable ? ' disabled' : '') + '"' +
        (unavailable ? ' disabled aria-disabled="true"' : ' onclick="navigateFromContext(\'' + groupId + '\',' + serviceIndex + ',' + index + ')"') + '>' +
        '<span class="navigation-module-item-copy"><strong>' + navEscapeHtml(item.label) + '</strong><small>' + navEscapeHtml(item.desc || 'Buka proses operasional') + '</small></span>' + state + '</button>';
    }).join('') + '</div>';
}

function openNavigationContext(groupId) {
  const group = findNavigationGroup(groupId);
  if (!group) return;
  const panel = document.getElementById('navigation-context');
  const scrim = document.getElementById('navigation-context-scrim');
  const prior = window.activeNavigationContext;
  const serviceIndex = prior?.groupId === groupId ? prior.serviceIndex : activeNavigationServiceIndex(group);
  renderNavigationContext(groupId, serviceIndex);
  panel?.classList.add('open');
  scrim?.classList.add('open');
  panel?.setAttribute('aria-hidden', 'false');
  scrim?.setAttribute('aria-hidden', 'false');
  document.querySelectorAll('.sidebar-main-btn').forEach((button) => button.setAttribute('aria-expanded', 'false'));
  document.querySelector('#' + groupId + ' .sidebar-main-btn')?.setAttribute('aria-expanded', 'true');
  document.querySelectorAll('.sidebar-accordion-group').forEach((el) => el.classList.remove('context-open'));
  document.getElementById(groupId)?.classList.add('context-open');
  requestAnimationFrame(() => document.querySelector('.navigation-service-card.active')?.focus());
}
window.openNavigationContext = openNavigationContext;

function closeNavigationContext() {
  const panel = document.getElementById('navigation-context');
  const scrim = document.getElementById('navigation-context-scrim');
  panel?.classList.remove('open');
  scrim?.classList.remove('open');
  panel?.setAttribute('aria-hidden', 'true');
  scrim?.setAttribute('aria-hidden', 'true');
  document.querySelectorAll('.sidebar-main-btn').forEach((button) => button.setAttribute('aria-expanded', 'false'));
  document.querySelectorAll('.sidebar-accordion-group').forEach((el) => el.classList.remove('context-open'));
}
window.closeNavigationContext = closeNavigationContext;

function selectNavigationService(groupId, serviceIndex) {
  renderNavigationContext(groupId, serviceIndex);
  requestAnimationFrame(() => document.querySelector('.navigation-service-card.active')?.focus());
}
window.selectNavigationService = selectNavigationService;

function navigateFromContext(groupId, serviceIndex, itemIndex) {
  const item = findNavigationGroup(groupId)?.services?.[serviceIndex]?.items?.[itemIndex];
  if (!item || item.soon || item.status === 'belum') return;
  closeNavigationContext();
  // Aksi hanya berasal dari konfigurasi menu yang dibangkitkan lokal dan telah
  // difilter RBAC saat rail dibuat. Tidak ada aksi dari input pengguna.
  Function(item.action)();
  setActiveFlyoutItem(item.page);
}
window.navigateFromContext = navigateFromContext;

// Nama lama dipertahankan agar pemanggil eksternal/legacy tidak rusak; kini
// ia membuka panel konteks dan tidak lagi memperlebar rail menjadi menu panjang.
function toggleSidebarAccordion(groupId) { openNavigationContext(groupId); }
window.toggleSidebarAccordion = toggleSidebarAccordion;
function toggleSidebarService() { /* Tingkat layanan dipilih di panel konteks. */ }
window.toggleSidebarService = toggleSidebarService;

function setActiveFlyoutItem(page) {
  window.currentPage = page;
  let activeGroup = null;
  (window.navigationMenuGroups || []).some((group) => group.services.some((service) => service.items.some((item) => {
    if (item.page !== page) return false;
    activeGroup = group;
    return true;
  })));
  document.querySelectorAll('.sidebar-accordion-group').forEach((groupEl) => groupEl.classList.remove('active-context'));
  if (activeGroup) document.getElementById(activeGroup.id)?.classList.add('active-context');
  document.querySelectorAll('.sidebar-main-btn').forEach((button) => button.classList.remove('active-group'));
  document.querySelector('#' + activeGroup?.id + ' .sidebar-main-btn')?.classList.add('active-group');
  if (document.getElementById('navigation-context')?.classList.contains('open') && activeGroup) {
    renderNavigationContext(activeGroup.id, activeNavigationServiceIndex(activeGroup));
  }
  updateBreadcrumb(page);
}

// Menyelaraskan penanda aktif saat berpindah halaman via navigate().
function syncFlyoutToPage(page) { setActiveFlyoutItem(page); }

// ══════════════════════════════════════════════════════════════
// KATEGORI: halaman indeks + pintasan atas (pengganti flyout)
// ══════════════════════════════════════════════════════════════

// Isi ikon rail dari definisi kategori (dipanggil saat halaman siap)
function paintRailIcons() {
  document.querySelectorAll('.rail-icon[data-icon]').forEach(el => {
    const cat = el.getAttribute('data-icon');
    const name = FLYOUT_MENUS[cat]?.icon || 'home';
    el.innerHTML = typeof icon === 'function' ? icon(name, 20) : '';
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintRailIcons);
else paintRailIcons();

// Item yang boleh dilihat user berdasarkan role
function visibleCategoryItems(cat) {
  const menu = FLYOUT_MENUS[cat];
  if (!menu) return [];
  const role = typeof getUserRole === 'function' ? getUserRole() : 'sales';
  const allowedPages = window.roleConfig?.pages || null;
  const isSuperAdmin = role === 'super_admin';
  return menu.items.filter(item => {
    if (item.adminOnly && !['super_admin','manager','direktur'].includes(role)) return false;
    if (!isSuperAdmin && allowedPages && !allowedPages.includes(item.page) && !item.soon) return false;
    return true;
  });
}

// Pintasan horizontal dinonaktifkan — menu sekarang terpusat di sidebar kiri
function renderSubnav(cat, activePage) {
  const el = document.getElementById('subnav');
  if (el) {
    el.classList.remove('show');
    el.innerHTML = '';
  }
}

// Kategori yang menampilkan ringkasan angka (KPI) di halaman indeksnya.
// Nilai = nama fungsi global yang mengisi #cat-summary.
const CATEGORY_SUMMARY = { lis: 'labCategorySummary' };

// Halaman indeks kategori — daftar submenu dikelompokkan
function openCategory(cat) {
  if (cat === 'agentic') {
    navigate('agentic');
    return;
  }
  const menu = FLYOUT_MENUS[cat];
  if (!menu) return;
  activeFlyoutCat = cat;
  window.currentPage = '';
  closeFlyout();

  document.querySelectorAll('.rail-item').forEach(b => b.classList.remove('active'));
  document.querySelector(`.rail-item[data-cat="${cat}"]`)?.classList.add('active');

  const titleEl = document.getElementById('topbar-title');
  if (titleEl) titleEl.textContent = menu.label;
  const domainEl = document.getElementById('breadcrumb-domain');
  const serviceWrap = document.getElementById('breadcrumb-service-wrap');
  const pageWrap = document.getElementById('breadcrumb-page-wrap');
  if (domainEl) domainEl.textContent = menu.label;
  if (serviceWrap) serviceWrap.hidden = true;
  if (pageWrap) pageWrap.hidden = true;

  if (window.innerWidth < 768) setSidebarOpen(false);

  const items = visibleCategoryItems(cat);
  renderSubnav(cat, null);

  const main = document.getElementById('main-content');
  if (!main) return;
  if (!items.length) {
    main.innerHTML = `<div class="empty-state" style="min-height:60vh"><div class="ico">🔒</div>
      <h3>Tidak ada menu yang tersedia</h3><p>Role Anda belum memiliki akses ke kategori ini.</p></div>`;
    return;
  }

  // Kelompokkan berdasarkan properti group; tanpa group → satu daftar
  const groups = {};
  items.forEach(it => { const g = it.group || 'Menu'; (groups[g] = groups[g] || []).push(it); });

  main.innerHTML = `
    <div class="cat-page">
      <header class="cat-head">
        <p class="cat-eyebrow">Kategori</p>
        <h1 class="cat-title">${menu.label}</h1>
        <p class="cat-sub">${items.length} menu tersedia${Object.keys(groups).length>1?` dalam ${Object.keys(groups).length} kelompok`:''}</p>
      </header>
      ${CATEGORY_SUMMARY[cat]?`<section class="cat-summary" style="margin-bottom:22px"><div id="cat-summary"></div></section>`:''}
      ${Object.entries(groups).map(([gname, gitems]) => `
        <section class="cat-group">
          ${Object.keys(groups).length>1?`<h2 class="cat-group-name">${gname}</h2>`:''}
          <div class="cat-grid">
            ${gitems.map(it => it.soon
              ? `<div class="cat-card disabled">
                   <span class="cat-card-ico">${icon(it.icon,18)}</span>
                   <div class="cat-card-body">
                     <div class="cat-card-label">${it.label}<span class="cat-card-soon">segera</span></div>
                     ${it.desc?`<div class="cat-card-desc">${it.desc}</div>`:''}
                   </div>
                 </div>`
              : `<button class="cat-card" onclick="${it.action};setActiveFlyoutItem('${it.page}')">
                   <span class="cat-card-ico">${icon(it.icon,18)}</span>
                   <div class="cat-card-body">
                     <div class="cat-card-label">${it.label}</div>
                     ${it.desc?`<div class="cat-card-desc">${it.desc}</div>`:''}
                   </div>
                   <span class="cat-card-go" aria-hidden="true">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                       stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                   </span>
                 </button>`
            ).join('')}
          </div>
        </section>`).join('')}
    </div>`;

  // Ringkasan angka (KPI) khusus kategori tertentu — diisi setelah kartu tampil.
  const summaryFn = CATEGORY_SUMMARY[cat];
  if (summaryFn && typeof window[summaryFn] === 'function') window[summaryFn]('cat-summary');
}
