<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lacak Nakes — AVA Home Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A2342;
    --navy-light: #0d2d54;
    --teal: #14b8a6;
    --teal-hover: #0d9488;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 8px 24px -18px rgba(15,23,42,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }

  header .mk {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal), #0ea5e9);
    display: grid;
    place-items: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 2px 10px rgba(20, 184, 166, 0.3);
  }

  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  header p {
    font-size: 11px;
    color: #93a4bd;
    font-weight: 500;
  }

  #card {
    background: var(--card-bg);
    margin: 16px;
    border-radius: 16px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
  }

  .lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
  }

  .val {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--navy);
  }

  #badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    border: 1px solid rgba(0,0,0,0.05);
  }

  #eta {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--teal);
    letter-spacing: -0.5px;
  }

  #map {
    height: 52vh;
    min-height: 320px;
    margin: 0 16px 16px;
    border-radius: 16px;
    border: 1px solid #cbd5e1;
    background: #dde5ec;
    box-shadow: var(--shadow-sm);
  }

  #msg {
    margin: 16px;
    padding: 16px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 13.5px;
    color: var(--text-muted);
    text-align: center;
    font-weight: 500;
  }

  .pulse {
    animation: pulse 1.4s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  a.call {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--teal);
    font-weight: 700;
    text-decoration: none;
    transition: color 0.15s ease;
  }

  a.call:hover {
    color: var(--teal-hover);
  }

  a.call svg {
    margin-top: -1px;
  }

  #v-fresh {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* GPS Pulse Indicator */
  .pulse-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7);
    animation: gpsPulse 1.4s infinite;
  }

  @keyframes gpsPulse {
    0% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7); }
    70% { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0); }
    100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
  }
</style>
</head>
<body>
<header>
  <div class="mk">OL</div>
  <div><h1>Pelacakan Kunjungan</h1><p>AVA Home Care</p></div>
</header>

<div id="msg" class="pulse">Memuat data pelacakan…</div>
<div id="card" style="display:none">
  <div class="row">
    <div>
      <div class="lbl">Nakes</div>
      <div class="val" id="v-staff">—</div>
      <a class="call" id="v-call" href="#" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        Hubungi
      </a>
    </div>
    <div style="text-align:right">
      <div class="lbl">Status</div>
      <span id="badge">—</span>
    </div>
  </div>
  <div class="row">
    <div>
      <div class="lbl">Layanan</div>
      <div class="val" id="v-svc">—</div>
    </div>
    <div style="text-align:right">
      <div class="lbl">Perkiraan Tiba</div>
      <div id="eta">—</div>
    </div>
  </div>
  <div class="lbl" style="margin-top:8px" id="v-fresh"></div>
</div>
<div id="map" style="display:none"></div>

<script>
const SUPABASE_URL = 'https://rmyqzyfvlmjxtatpctks.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJteXF6eWZ2bG1qeHRhdHBjdGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDQzNzIsImV4cCI6MjA5NjgyMDM3Mn0.tBVQBNH-yi9bmcpY7MRf5w-diwonMTDqwfAOs3t7YK8';
const HDR = { apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json' };
const STATUS_COLOR = { 'Baru':'#94A3B8','Dikonfirmasi':'#0EA5E9','Dijadwalkan':'#8B5CF6','Dalam Perjalanan':'#F97316','Sedang Dilayani':'#22C55E','Selesai':'#00897B','Dibatalkan':'#EF4444' };
const token = new URLSearchParams(location.search).get('token');
let map, patientMarker, staffMarker, directions, mapReady=false;

function showMsg(t){ const m=document.getElementById('msg'); m.style.display='block'; m.classList.remove('pulse'); m.textContent=t; }

async function rpc(fn,args){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:HDR,body:JSON.stringify(args||{})});
  if(!r.ok) throw new Error('Gagal memuat data ('+r.status+')');
  return r.json();
}
async function getMapsKey(){
  try{ const r=await fetch(`${SUPABASE_URL}/rest/v1/settings?key=eq.maps_api_key&select=value`,{headers:HDR});
    const d=await r.json(); return d?.[0]?.value || ''; }catch(e){ return ''; }
}
function loadMaps(key){ return new Promise((res,rej)=>{
  if(window.google&&google.maps) return res();
  window.__ready=()=>res(); const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${key}&callback=__ready&language=id`;
  s.async=true; s.onerror=()=>rej(new Error('Gagal memuat peta')); document.head.appendChild(s);
}); }

async function tick(){
  let d; try{ d=await rpc('homecare_track_public',{p_token:token}); }catch(e){ showMsg('❌ '+e.message); return; }
  if(!d || !d.order_number){ showMsg('Link pelacakan tidak valid atau order telah selesai.'); return; }
  document.getElementById('msg').style.display='none';
  document.getElementById('card').style.display='block';
  document.getElementById('v-staff').textContent = d.staff_name || 'Belum ditugaskan';
  document.getElementById('v-svc').textContent = d.service_type || '—';
  const b=document.getElementById('badge'); b.textContent=d.status||'—'; b.style.background=STATUS_COLOR[d.status]||'#64748b';
  const call=document.getElementById('v-call');
  if(d.staff_phone){ call.style.display='inline-flex'; call.href='tel:'+d.staff_phone; } else call.style.display='none';
  document.getElementById('v-fresh').innerHTML = d.staff_loc_at
    ? (d.loc_fresh ? '<span class="pulse-dot"></span> Lokasi nakes aktif (live)' : 'Lokasi terakhir ' + new Date(d.staff_loc_at).toLocaleTimeString('id-ID'))
    : 'Nakes belum berbagi lokasi';

  if(!mapReady && (d.patient_lat || d.staff_lat)){
    document.getElementById('map').style.display='block';
    const c = d.patient_lat?{lat:+d.patient_lat,lng:+d.patient_lng}:{lat:+d.staff_lat,lng:+d.staff_lng};
    map=new google.maps.Map(document.getElementById('map'),{center:c,zoom:14,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});
    directions=new google.maps.DirectionsRenderer({map,suppressMarkers:true,polylineOptions:{strokeColor:'#14b8a6',strokeWeight:5}});
    mapReady=true;
  }
  if(mapReady){
    if(d.patient_lat){ const p={lat:+d.patient_lat,lng:+d.patient_lng};
      if(!patientMarker) patientMarker=new google.maps.Marker({position:p,map,label:{text:'🏠',fontSize:'20px'},title:'Lokasi Anda'});
      else patientMarker.setPosition(p); }
    if(d.staff_lat){ const s={lat:+d.staff_lat,lng:+d.staff_lng};
      if(!staffMarker) staffMarker=new google.maps.Marker({position:s,map,label:{text:'🚑',fontSize:'22px'},zIndex:99,title:d.staff_name||'Nakes'});
      else staffMarker.setPosition(s); }
    // Rute + ETA bila kedua titik ada & nakes dalam perjalanan
    if(d.patient_lat && d.staff_lat && d.loc_fresh && d.status!=='Selesai'){
      new google.maps.DirectionsService().route({origin:{lat:+d.staff_lat,lng:+d.staff_lng},destination:{lat:+d.patient_lat,lng:+d.patient_lng},travelMode:'DRIVING'},(r,st)=>{
        if(st==='OK'&&r.routes[0]){ directions.setDirections(r); const leg=r.routes[0].legs[0];
          document.getElementById('eta').textContent=leg.duration.text; }
      });
      const bnds=new google.maps.LatLngBounds(); bnds.extend(patientMarker.getPosition()); bnds.extend(staffMarker.getPosition()); map.fitBounds(bnds);
    } else if(d.status==='Sedang Dilayani'){ document.getElementById('eta').textContent='Sedang dilayani'; }
      else if(d.status==='Selesai'){ document.getElementById('eta').textContent='Selesai'; }
      else document.getElementById('eta').textContent='—';
  }
}

(async ()=>{
  if(!token){ showMsg('Token pelacakan tidak ditemukan di tautan.'); return; }
  const key=await getMapsKey();
  if(key){ try{ await loadMaps(key); }catch(e){ /* peta gagal, tetap tampil kartu */ } }
  await tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
